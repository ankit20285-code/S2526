<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday DivyA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<section id="intro">
  <p class="i1">A Divine's Journey</p>
  <p class="i2">Welcome to DiBA Journey</p>
  <button id="begin" type="button">Begin the Journey</button>
</section>

<nav id="nav" aria-label="Main">
  <a href="#top">Home</a><a href="#story">Story</a><a href="#photos">Photos</a>
</nav>

<div id="prog" aria-hidden="true"><span>Start</span><div><i></i></div><span>Today</span></div>

<main id="top">
  <div id="story"><div id="timeline"><div class="line"><b></b></div></div></div>

  <section id="ending">
    <div class="sun" aria-hidden="true"></div>
    <div id="waves" aria-hidden="true"></div>
    <div class="end-in reveal stg">
      <p id="e-lead"></p>
      <h2 id="e-title"></h2>
      <p id="e-sub"></p>
      <p id="e-msg"></p>
      <button id="replay" type="button">↻ Walk through the Journey again</button>
    </div>
  </section>
</main>

<div id="player" hidden>
  <button id="pp" type="button" aria-label="Pause music">❚❚</button>
  <div class="pi"><span id="mt"></span><div class="bar"><i id="pb"></i></div></div>
  <input id="vol" type="range" min="0" max="1" step=".05" value=".6" aria-label="Volume">
</div>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Photograph">
  <button class="x" type="button" aria-label="Close">×</button>
  <figure><img alt=""><figcaption><time></time><h3></h3><p></p></figcaption></figure>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
